{% extends 'casos/base.html' %}

{% block contenido %}
<h2>Eliminar Cliente</h2>
<p>¿Estás seguro de que deseas eliminar a <strong>{{ object.nombres }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'cliente_list' %}" class="btn">Cancelar</a>
</form>
{% endblock %}
