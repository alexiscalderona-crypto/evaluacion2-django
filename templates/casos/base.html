<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal Abogados | Vargas & Asociados</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background-color: #2c3e50; color: white; padding: 15px 20px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .container { padding: 20px; max-width: 900px; margin: auto; background: white; min-height: 400px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-top: 20px; }
        footer { background-color: #2c3e50; color: white; text-align: center; padding: 10px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { display: inline-block; padding: 8px 12px; background: #3498db; color: white; text-decoration: none; border-radius: 4px; }
        .btn-danger { background: #e74c3c; }
    </style>
</head>
<body>

<header>
    <h2>Vargas & Asociados - Portal</h2>
    <nav>
        <a href="{% url 'cliente_list' %}">Clientes</a>
        <a href="{% url 'lista_casos' %}">Casos</a>
    </nav>
</header>

<div class="container">
    {% block contenido %}
    {% endblock %}
</div>

<footer>
    <p>&copy; 2026 Vargas & Asociados. Todos los derechos reservados.</p>
</footer>

</body>
</html>
